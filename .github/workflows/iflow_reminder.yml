name: 心流APIKey提醒
on:
  schedule:
    # cron表达式：分 时 日 月 周 | UTC3点 = 北京时间11点（快8小时）
    - cron: '0 3 * * *'
  workflow_dispatch:  # 保留手动触发，方便测试推送

jobs:
  reminder:
    runs-on: ubuntu-latest
    # 强制使用Node24，消除GitHub的Node20弃用警告
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: 拉取仓库代码
        uses: actions/checkout@v4

      - name: 配置Python环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'  # 稳定版本，兼容所有环境

      - name: 安装依赖
        run: pip install requests  # 仅需requests库，轻量

      - name: 运行提醒脚本
        env:
          # 从GitHub Secrets读取飞书Webhook，避免硬编码
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
        run: python iflow_reminder.py
